[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arion-volunteer"
version = "0.1.0"
description = "Arion Core with an open governance-role registry and reusable volunteer skills."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.16,<0.18",
]

[tool.setuptools.packages.find]
include = ["planner*", "risk_methods*", "volunteer_pack*"]

[tool.setuptools.package-data]
risk_methods = ["*.yaml", "README.md"]
"volunteer_pack" = [
  "*.yaml",
  "README.md",
  "methods/*.yaml",
  "connectors/*.yaml",
  "roles/*.md",
  "skills/*.md",
  "skills/*/*/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
